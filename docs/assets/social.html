<!doctype html>
<!-- GitHub social preview (1280x640, upload in Settings > Social preview). Render: Chrome --headless --screenshot --window-size=1280,640. No version or star badges, so it never goes stale. -->
<html lang="en"><head><meta charset="utf-8"><title>rust-anything social preview</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    background: #0b0f12;
    color: #f4f5f2;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgb(150 170 185 / 0.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgb(150 170 185 / 0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(80% 90% at 30% 50%, #000 30%, transparent 85%);
  }
  .glow {
    position: absolute; left: -120px; top: 40px; width: 760px; height: 600px;
    background:
      radial-gradient(40% 40% at 50% 55%, rgb(224 118 63 / 0.42), transparent 70%),
      radial-gradient(30% 30% at 30% 30%, rgb(70 120 150 / 0.25), transparent 70%);
    filter: blur(8px);
  }
  .crab {
    position: absolute; left: 40px; top: 50%; transform: translateY(-50%);
    width: 520px; height: auto;
    filter: drop-shadow(0 0 40px rgb(224 118 63 / 0.45)) drop-shadow(0 20px 30px rgb(0 0 0 / 0.6));
  }
  .text { position: absolute; left: 600px; right: 64px; top: 116px; }
  h1 { font-size: 78px; font-weight: 800; letter-spacing: -2.5px; line-height: 1; }
  .tag { margin-top: 22px; font-size: 32px; font-weight: 600; line-height: 1.2; letter-spacing: -0.4px; }
  .tag span {
    display: block;
    background: linear-gradient(90deg, #8fb3c7 0%, #c9a28a 45%, #e0763f 80%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stats { display: flex; gap: 14px; margin-top: 36px; }
  .stat { flex: 1; padding: 14px 16px; border-radius: 12px; background: rgb(255 255 255 / 0.04); border: 1px solid rgb(150 170 185 / 0.16); }
  .stat b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -0.8px; color: #fff; }
  .stat small { display: block; margin-top: 4px; font-size: 15px; line-height: 1.3; color: #a3acb2; }
  .langs { margin-top: 30px; font-size: 19px; color: #f08a55; font-weight: 600; letter-spacing: 0.2px; }
  .link { margin-top: 12px; font-size: 18px; color: #7d868d; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <img class="crab" src="crab.png" alt="">
  <div class="text">
    <h1>rust-anything</h1>
    <p class="tag">Rewrite your app in Rust.<span>Prove it behaves the same.</span></p>
    <div class="stats">
      <div class="stat"><b>32x</b><small>Fuse.js search, per query</small></div>
      <div class="stat"><b>3.5 MB</b><small>json-server idle, from 74 MB</small></div>
      <div class="stat"><b>514/514</b><small>HTTP cases match, pure Rust</small></div>
    </div>
    <p class="langs">TypeScript · JavaScript · Python · Go · Ruby · Java · C · PHP · C#</p>
    <p class="link">github.com/erkamyaman/rust-anything · MIT</p>
  </div>
</body></html>
