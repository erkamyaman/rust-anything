<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="340" viewBox="0 0 1330 340" role="img" aria-label="rust-anything이 코드를 포팅하는 방식: analyze가 무엇을 포팅할지 계획하고, rust-anything go가 브리지, 기록, 에이전트의 포팅, gate를 기록된 모든 케이스가 일치할 때까지 반복한 뒤, enable이 호출을 Rust로 전환합니다">
