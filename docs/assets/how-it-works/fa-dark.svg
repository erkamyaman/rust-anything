<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="340" viewBox="0 0 1330 340" role="img" aria-label="rust-anything چگونه کد را پورت می‌کند: analyze برنامه می‌ریزد چه چیزی پورت شود؛ rust-anything go پل می‌سازد، ضبط می‌کند، پورت را به ایجنت شما می‌سپارد و از gate می‌گذراند، و تا وقتی همهٔ موردهای ضبط‌شده مطابقت کنند تکرار می‌کند؛ سپس enable فراخوانی‌ها را به Rust می‌برد">
<rect x="0" y="78" width="200" height="170" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="22" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#ec6a2c">‫برنامه‬</text>
<text x="22" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#e6edf3">analyze</text>
<text x="22" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9da7b3">‫اول چه چیزی پورت شود.‬</text>
<text x="22" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9da7b3">‫بدون مصرف توکن.‬</text>
