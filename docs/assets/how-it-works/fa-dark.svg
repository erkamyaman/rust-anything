<text x="292" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9da7b3">‫برای یک واحد.‬</text>
<rect x="468" y="78" width="180" height="170" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="490" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#ec6a2c">2</text>
<text x="490" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#e6edf3">record</text>
<text x="490" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9da7b3">‫رفتار واقعی نسخهٔ‬</text>
<text x="490" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9da7b3">‫اصلی، ذخیره‌شده.‬</text>
