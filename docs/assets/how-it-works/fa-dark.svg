<text x="855.0" y="304" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#ec6a2c">‫رد شد: دور بعد‬</text>
<line x1="1060" y1="163" x2="1121" y2="163" stroke="#ec6a2c" stroke-width="2"/><path d="M1120,157 L1130,163 L1120,169 Z" fill="#ec6a2c"/>
<text x="1095.0" y="149" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#ec6a2c">‫پاس شد‬</text>
