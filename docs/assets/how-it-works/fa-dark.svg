<text x="688" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#ec6a2c">3</text>
<text x="688" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#e6edf3">port</text>
<text x="688" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9da7b3">‫ایجنت شما کد‬</text>
<text x="688" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9da7b3">‫Rust را می‌نویسد.‬</text>
