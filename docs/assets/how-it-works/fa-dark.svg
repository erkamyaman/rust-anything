<text x="379" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#ffffff">rust-anything go</text>
<rect x="270" y="78" width="180" height="170" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="292" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#ec6a2c">1</text>
