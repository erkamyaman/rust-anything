<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="340" viewBox="0 0 1330 340" role="img" aria-label="rust-anything がコードを移植する流れ：analyze が何を移植するかのプランを立て、rust-anything go がブリッジ、記録、エージェントによる移植、gate を、記録したすべてのケースが一致するまで繰り返し、最後に enable が呼び出しを Rust に切り替えます">
<rect x="0" y="78" width="200" height="170" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="22" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#b34a1a">プラン</text>
<text x="22" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#1f2328">analyze</text>
<text x="22" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">何から移植するか。</text>
<text x="22" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">トークン不要。</text>
