<text x="490" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#b34a1a">2</text>
<text x="490" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#1f2328">record</text>
<text x="490" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">オリジナルの</text>
<text x="490" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">振る舞いを保存。</text>
<rect x="666" y="78" width="180" height="170" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="688" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#b34a1a">3</text>
<text x="688" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#1f2328">port</text>
<text x="688" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">エージェントが</text>
<text x="688" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">Rust を書く。</text>
