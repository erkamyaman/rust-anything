[request]
method = "POST"
path = "/posts"
body = '{"id": "custom", "title": "custom id"}'

[request.headers]
Content-Type = "application/json"

[response]
status = 201

[response.headers]
access-control-allow-headers = "content-type"
access-control-allow-methods = "GET, HEAD, PUT, PATCH, POST, DELETE"
access-control-allow-origin = "*"
content-type = "application/json"
