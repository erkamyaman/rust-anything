[request]
method = "PATCH"
path = "/posts/3"
body = '{"views": 51, "extra": {"a": [1, "b"]}}'

[request.headers]
Content-Type = "application/json"

[response]
status = 200

[response.headers]
access-control-allow-headers = "content-type"
access-control-allow-methods = "GET, HEAD, PUT, PATCH, POST, DELETE"
access-control-allow-origin = "*"
content-type = "application/json"
