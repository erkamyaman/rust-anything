[request]
method = "POST"
path = "/users"
body = '{"from":"octet"}'

[request.headers]
Content-Type = "application/octet-stream"

[response]
status = 201

[response.headers]
access-control-allow-headers = "content-type"
access-control-allow-methods = "GET, HEAD, PUT, PATCH, POST, DELETE"
access-control-allow-origin = "*"
content-type = "application/json"
