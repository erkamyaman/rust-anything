[package]
name = "json-server-js"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "The JavaScript semantics json-server's behavior depends on: V8's JSON.parse and JSON.stringify, comparisons, number parsing, URL decoding, dot-prop paths, ICU collation and inflection"

[dependencies]
icu_collator = "2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
